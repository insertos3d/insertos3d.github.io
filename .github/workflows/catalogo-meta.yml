# Regenera el catálogo de Meta (Facebook / Instagram / WhatsApp Business) desde Supabase.
# Publica: https://insertos3d.com/catalogo/meta.csv  (Meta Commerce Manager lo descarga cada día)
name: Catálogo Meta

on:
  schedule:
    - cron: "17 */6 * * *"      # cada 6 horas (UTC)
  workflow_dispatch:            # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths:
      - "js/productos.js"
      - "img/productos/**"
      - "scripts/catalogo_meta.py"
      - "scripts/requirements.txt"
      - ".github/workflows/catalogo-meta.yml"

permissions:
  contents: write               # para guardar el catálogo actualizado en el repositorio

concurrency:
  group: catalogo-meta
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar catálogo
        run: python scripts/catalogo_meta.py

      - name: Guardar cambios (solo si el catálogo cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "Actualiza catálogo de Meta"
            git push
          fi
